<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6ef"><title>一周菜单 · 好好吃饭，简单一点</title><link rel="stylesheet" href="style.css?v=300-1"></head><body><header><a class="brand" href="#">◉ 一周菜单<span>WEEKLY MENU</span></a><nav><a href="#picker">转盘选菜</a><a href="#week">我的一周</a><a href="#shopping">采购清单 ↗</a></nav></header><main><div class="screen choice-screen"><section class="intro"><h1>今天吃什么？<span>转一下就好。</span></h1><p>300 道家常菜 · 简单做，安心带饭</p></section><section id="picker" class="picker"><div class="wheel-side"><div class="section-top"><span>01 / 今天吃点什么</span><span class="handwritten">让好运替你点菜 ↘</span></div><div class="wheel-wrap"><div class="pointer"></div><svg id="wheel" viewBox="0 0 480 480" role="img" aria-label="家常菜随机转盘"></svg><button id="spin" class="spin" aria-label="转动转盘抽一道菜">开饭<span>转一下 ↗</span></button></div><label class="wheel-count">转盘菜数 <select id="wheel-count"><option value="50">50 道</option><option value="100">100 道</option><option value="200">200 道</option><option value="300" selected>300 道</option></select></label><div class="wheel-note"><span class="dot"></span><span id="pool-note"></span></div></div><div class="decision"><div class="eyebrow">TODAY’S LITTLE DECISION</div><h2>今天，想怎么吃？</h2><p class="muted">挑一点偏好，剩下的交给运气。</p><div class="filter-group"><label>吃点什么</label><div id="categories" class="chips"><button class="active" data-category="全部" aria-pressed="true">都可以</button><button data-category="鸡肉" aria-pressed="false">鸡肉</button><button data-category="猪肉" aria-pressed="false">猪肉</button><button data-category="牛羊肉" aria-pressed="false">牛羊肉</button><button data-category="鸭兔" aria-pressed="false">鸭兔</button><button data-category="鱼虾" aria-pressed="false">鱼虾</button><button data-category="蛋类" aria-pressed="false">蛋类</button><button data-category="豆制品" aria-pressed="false">豆制品</button><button data-category="蔬菜" aria-pressed="false">蔬菜</button></div></div><div class="selects"><label>一人份预算<select id="budget"><option value="50">50 元以内 · 都可以</option><option value="5">5 元以内</option><option value="8">8 元以内</option><option value="10">10 元以内</option><option value="20">20 元以内</option><option value="30">30 元以内</option></select></label><label>下厨时间<select id="time"><option value="999">慢慢来 · 不限</option><option value="15">15 分钟以内</option><option value="20">20 分钟以内</option></select></label></div><article id="result" aria-live="polite"></article><p class="fine">价格为单人份食材估算，不含主食及调料，随地区浮动。</p></div></section></div><div class="screen plan-screen"><section id="week" class="week"><div class="heading"><div><div class="eyebrow">A WEEK, WELL FED</div><h2>我的一周</h2></div><button id="generate" class="outline">随机一周 ↻</button></div><p class="muted">每天一道主菜，按天烹饪。</p><div id="days" class="days"></div><p id="status" class="fine" role="status"></p></section><section id="shopping" class="shopping"><div class="heading"><div><div class="eyebrow">READY FOR THE MARKET</div><h2>食材采购清单</h2></div><div class="shopping-tools"><select id="people" aria-label="用餐人数"><option value="1">1 人份</option><option value="2">2 人份</option><option value="3">3 人份</option><option value="4">4 人份</option></select><button id="copy-list" class="solid">复制清单 ↗</button></div></div><p class="muted">同名食材已合并 · 采购克数为估算</p><div id="shopping-groups" class="shopping-grid"></div><p id="shopping-status" class="fine" role="status"></p></section></div></main><dialog id="detail"><button class="close" aria-label="关闭菜谱">×</button><div id="detail-content"></div></dialog><script src="recipes.js?v=300-1"></script><script src="app.js?v=300-1"></script></body></html>
